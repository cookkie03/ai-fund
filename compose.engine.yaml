services:
  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    env_file:
      - .env
    environment:
      TRADING_AGENT_DB: /app/data/trading-agent.db
      # Etichetta dell'account broker servito da questo Runtime (uno per account).
      TRADING_AGENT_ACCOUNT_LABEL: ${TRADING_AGENT_ACCOUNT_LABEL:-default}
      # OmniRoute gira sullo stesso host, in un container sulla rete omniroute_default.
      OFFICE_LLM_ENDPOINT: http://omniroute:20128/v1
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - trading-agent-data:/app/data
    networks:
      - default
      - omniroute
    restart: unless-stopped

networks:
  omniroute:
    name: omniroute_default
    external: true

volumes:
  trading-agent-data:
